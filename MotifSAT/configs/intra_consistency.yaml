# Method preset: INTRA-MOTIF CONSISTENCY.
#
# Base-GSAT node extractor (atoms scored independently) + a within-motif penalty
# that pushes a motif's atoms toward the same gate. This is mechanism 1, intra
# only (between term off).
#
# Dataset / backbone / roots come from the CLI (they override this preset), e.g.:
#   python run.py --config MotifSAT/configs/intra_consistency.yaml \
#       --dataset Mutagenicity --backbone GIN --fold 0 \
#       --data_root <FOLDS> --vocab_root <vocab> --vocab_variant <variant>
motif_method: loss
noise: none
info_loss_level: node
w_message: true
motif_loss_coef: 1.0
within_node_coef: 1.0
between_motif_coef: 0.0
