# Method preset: readout_layernorm with the KL term at NODE level (KL-level control, 2026-10-26).
#
# Identical to readout_layernorm.yaml (motif gates sampled per motif and broadcast to atoms) except
# info_loss_level: node — the KL is averaged over ATOMS of the broadcast motif gates, so each
# motif's KL counts once per atom (size-weighted) instead of once per motif. Separates the gate
# unit from the KL unit (EXPERIMENT_LOG §9.4.1).
motif_method: readout
noise: motif
info_loss_level: node
w_message: true
motif_scorer_norm: layer
