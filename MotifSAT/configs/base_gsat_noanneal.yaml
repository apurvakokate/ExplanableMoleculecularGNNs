# Method preset: BASE GSAT (node extractor), NO IB annealing.
#
# Same as base_gsat.yaml but with NO annealing: fix_r holds the IB prior r CONSTANT at
# the run's final_r from epoch 0 (GSAT's fix_r). Before 2026-10-23 this preset used
# decay_r: 0.0, which froze r at init_r (0.9) instead — runs made with that version
# (e.g. base_runs/base_gsat_noanneal) used r = 0.9 throughout.
#
# Dataset / backbone / roots come from the CLI (they override this preset), e.g.:
#   python run.py --config MotifSAT/configs/base_gsat_noanneal.yaml \
#       --dataset Mutagenicity --backbone GIN --fold 0 \
#       --data_root <FOLDS> --vocab_root <vocab> --vocab_variant <variant>
motif_method: none
noise: none
learn_edge_att: false
info_loss_level: node
w_message: true
fix_r: true
