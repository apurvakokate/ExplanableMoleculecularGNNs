# Method preset: motif_emb_iddesc_chem_res with the KL term at NODE level (KL-level control for the validation-selected
# motif graph, 2026-10-27).
#
# Identical to motif_emb_iddesc_chem_res.yaml (motif gates sampled per motif and broadcast to atoms) except
# info_loss_level: node — the KL is averaged over ATOMS of the broadcast motif gates, so each
# motif's KL counts once per atom (size-weighted) instead of once per motif. Separates the gate
# unit from the KL unit (EXPERIMENT_LOG §9.4.1); same design as motif_emb_iddesc_gin_res_nodekl.yaml.
motif_method: motif_emb
noise: motif
info_loss_level: node
w_message: true
motif_feat: id_desc
motif_edge_feat: true
motif_edge_chem: true
motif_gnn_layers: 2
motif_gnn_norm: layer
motif_gnn_residual: true
